<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비밀번호 확인기</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f2f5;
            margin: 0;
        }
        .container {
            background: #ffffff;
            padding: 35px 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
            width: 340px;
        }
        h2 {
            margin: 0 0 25px 0;
            text-align: center;
            color: #1a1a1a;
            font-size: 22px;
        }
        .input-group {
            margin-bottom: 18px;
            position: relative;
        }
        label {
            display: block;
            margin-bottom: 6px;
            color: #4a5568;
            font-size: 13px;
            font-weight: 600;
        }
        input {
            width: 100%;
            padding: 12px;
            padding-right: 75px;
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus {
            border-color: #3182ce;
        }
        .btn-group-inline {
            position: absolute;
            right: 8px;
            top: 29px;
            display: flex;
            gap: 4px;
        }
        .icon-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 15px;
            padding: 4px 6px;
            border-radius: 4px;
            color: #718096;
        }
        .icon-btn:hover {
            background-color: #edf2f7;
            color: #2d3748;
        }
        .btn-stack {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 20px;
        }
        .main-btn {
            width: 100%;
            padding: 12px;
            background-color: #3182ce;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .main-btn:hover {
            background-color: #2b6cb0;
        }
        .sub-btn {
            width: 100%;
            padding: 10px;
            background-color: #e2e8f0;
            color: #4a5568;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .sub-btn:hover {
            background-color: #cbd5e0;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>비밀번호 저장 / 불러오기</h2>
    <form id="loginForm" onsubmit="handleSubmit(event)">
        
        <div class="input-group">
            <label for="username">이메일 계정</label>
            <input type="email" id="username" name="username" autocomplete="username" placeholder="example@email.com" required>
        </div>

        <div class="input-group">
            <label for="password">비밀번호</label>
            <input type="password" id="password" name="password" autocomplete="current-password" placeholder="비밀번호 입력" required>
            <div class="btn-group-inline">
                <button type="button" class="icon-btn" onclick="togglePassword()" title="비밀번호 보기">👁️</button>
                <button type="button" class="icon-btn" onclick="copyPassword()" title="비밀번호 복사">📋</button>
            </div>
        </div>

        <div class="input-group hidden" id="codeGroup">
            <label for="authCode">이메일 인증 코드</label>
            <input type="text" id="authCode" placeholder="인증 코드 6자리 입력" style="padding-right: 12px;">
        </div>

        <div class="btn-stack">
            <button type="button" class="sub-btn" id="sendBtn" onclick="sendEmailCode()">📩 인증 코드 이메일 전송</button>
            <button type="button" class="sub-btn hidden" id="verifyBtn" onclick="verifyCode()">🔑 코드 확인 및 비번 불러오기</button>
            <button type="submit" class="main-btn">비밀번호 저장 제출</button>
            <button type="button" class="sub-btn" onclick="clearFields()">초기화</button>
        </div>
    </form>
</div>

<script>
    const SERVER_URL = 'http://localhost:3000';

    function togglePassword() {
        const passwordInput = document.getElementById('password');
        passwordInput.type = passwordInput.type === 'password' ? 'text' : 'password';
    }

    function copyPassword() {
        const passwordInput = document.getElementById('password');
        if (!passwordInput.value) {
            alert('복사할 비밀번호가 없습니다.');
            return;
        }
        navigator.clipboard.writeText(passwordInput.value)
            .then(() => alert('비밀번호가 복사되었습니다.'))
            .catch(() => alert('복사 실패'));
    }

    function clearFields() {
        document.getElementById('username').value = '';
        document.getElementById('password').value = '';
        document.getElementById('authCode').value = '';
        document.getElementById('codeGroup').classList.add('hidden');
        document.getElementById('verifyBtn').classList.add('hidden');
    }

    async function sendEmailCode() {
        const email = document.getElementById('username').value;
        if (!email) {
            alert('이메일을 입력해주세요.');
            return;
        }

        try {
            const response = await fetch(`${SERVER_URL}/api/send-code`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email })
            });

            const result = await response.json();
            alert(result.message);

            if (result.success) {
                document.getElementById('codeGroup').classList.remove('hidden');
                document.getElementById('verifyBtn').classList.remove('hidden');
            }
        } catch (error) {
            alert('서버와 통신할 수 없습니다. 백엔드 서버 실행 여부를 확인하세요.');
        }
    }

    async function verifyCode() {
        const email = document.getElementById('username').value;
        const code = document.getElementById('authCode').value;

        if (!code) {
            alert('인증 코드를 입력해주세요.');
            return;
        }

        try {
            const response = await fetch(`${SERVER_URL}/api/verify-code`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, code })
            });

            const result = await response.json();

            if (result.success) {
                alert('인증 완료! 저장된 비밀번호 항목을 선택하세요.');
                const passInput = document.getElementById('password');
                passInput.type = 'text';
                passInput.focus();
                passInput.click();
            } else {
                alert(result.message);
            }
        } catch (error) {
            alert('인증 확인 중 오류가 발생했습니다.');
        }
    }

    function handleSubmit(e) {
        e.preventDefault();
    }
</script>

</body>
</html>
