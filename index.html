<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비밀번호 저장 & 확인기</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f9;
            margin: 0;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 320px;
        }
        h2 {
            margin-bottom: 20px;
            text-align: center;
            color: #333;
        }
        .input-group {
            margin-bottom: 15px;
            position: relative;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #666;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 10px;
            padding-right: 40px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 14px;
        }
        .toggle-btn {
            position: absolute;
            right: 10px;
            top: 32px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }
        .submit-btn {
            width: 100%;
            padding: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        .submit-btn:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>비밀번호 저장 & 확인</h2>
    <!-- action="javascript:void(0);"를 사용해 페이지 뒤로가기/새로그침 없이 제출 처리 -->
    <form id="loginForm" onsubmit="handleSave(event)">
        <div class="input-group">
            <label for="username">사이트명 또는 아이디</label>
            <input type="text" id="username" name="username" autocomplete="username" placeholder="아이디/사이트명 입력" required>
        </div>
        
        <div class="input-group">
            <label for="password">비밀번호</label>
            <input type="password" id="password" name="password" autocomplete="current-password" placeholder="비밀번호 입력" required>
            <button type="button" class="toggle-btn" onclick="togglePassword()">👁️</button>
        </div>

        <button type="submit" class="submit-btn">비밀번호 저장하기</button>
    </form>
</div>

<script>
    // 비밀번호 보이기/숨기기 토글
    function togglePassword() {
        const passwordInput = document.getElementById('password');
        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
        } else {
            passwordInput.type = 'password';
        }
    }

    // 폼 제출 시 브라우저가 저장 팝업을 띄우도록 유도
    function handleSave(event) {
        event.preventDefault(); // 페이지 새로고침 방지
        alert('입력한 정보가 전송되었습니다. 브라우저 상단의 [비밀번호 저장] 팝업을 확인하세요!');
    }
</script>

</body>
</html>
