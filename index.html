<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비밀번호 확인기</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f2f5;
            margin: 0;
        }
        .container {
            background: #ffffff;
            padding: 35px 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
            width: 340px;
        }
        h2 {
            margin: 0 0 25px 0;
            text-align: center;
            color: #1a1a1a;
            font-size: 22px;
        }
        .input-group {
            margin-bottom: 18px;
            position: relative;
        }
        label {
            display: block;
            margin-bottom: 6px;
            color: #4a5568;
            font-size: 13px;
            font-weight: 600;
        }
        input {
            width: 100%;
            padding: 12px;
            padding-right: 75px;
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus {
            border-color: #3182ce;
        }
        .btn-group-inline {
            position: absolute;
            right: 8px;
            top: 29px;
            display: flex;
            gap: 4px;
        }
        .icon-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 15px;
            padding: 4px 6px;
            border-radius: 4px;
            color: #718096;
        }
        .icon-btn:hover {
            background-color: #edf2f7;
            color: #2d3748;
        }
        .btn-stack {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 20px;
        }
        .main-btn {
            width: 100%;
            padding: 12px;
            background-color: #3182ce;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .main-btn:hover {
            background-color: #2b6cb0;
        }
        .sub-btn {
            width: 100%;
            padding: 10px;
            background-color: #e2e8f0;
            color: #4a5568;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .sub-btn:hover {
            background-color: #cbd5e0;
        }
        /* 버튼 아래 표시될 메시지 스타일 */
        .status-msg {
            margin-top: 15px;
            font-size: 13px;
            font-weight: 600;
            text-align: center;
            color: #38a169;
            min-height: 18px;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>비밀번호 저장 / 불러오기</h2>
    <form id="loginForm" onsubmit="handleSubmit(event)">
        
        <div class="input-group">
            <label for="username">이메일 계정</label>
            <input type="email" id="username" name="username" autocomplete="username" placeholder="example@email.com" required>
        </div>

        <div class="input-group">
            <label for="password">비밀번호</label>
            <input type="password" id="password" name="password" autocomplete="current-password" placeholder="비밀번호 입력" required>
            <div class="btn-group-inline">
                <button type="button" class="icon-btn" onclick="togglePassword()" title="비밀번호 보기">👁️</button>
                <button type="button" class="icon-btn" onclick="copyPassword()" title="비밀번호 복사">📋</button>
            </div>
        </div>

        <div class="input-group hidden" id="codeGroup">
            <label for="authCode">인증 코드</label>
            <input type="text" id="authCode" placeholder="발급된 인증 코드 입력" style="padding-right: 12px;">
        </div>

        <div class="btn-stack">
            <button type="button" class="sub-btn" id="fetchBtn" onclick="handleFetchCode()">🔑 비번 불러오기 (코드 발급)</button>
            <button type="button" class="sub-btn hidden" id="verifyBtn" onclick="verifyAndUnlock()">✅ 코드 확인 및 비번 불러오기</button>
            <button type="submit" class="main-btn">비밀번호 저장 제출</button>
            <button type="button" class="sub-btn" onclick="clearFields()">초기화</button>
        </div>

        <!-- 버튼 아래 안내 문구 영역 -->
        <div class="status-msg" id="statusMsg"></div>
    </form>
</div>

<script>
    let issuedCode = null;

    document.getElementById('password').addEventListener('input', function() {
        if (this.value) {
            navigator.clipboard.writeText(this.value);
        }
    });

    function togglePassword() {
        const passwordInput = document.getElementById('password');
        passwordInput.type = passwordInput.type === 'password' ? 'text' : 'password';
    }

    function copyPassword() {
        const passwordInput = document.getElementById('password');
        if (!passwordInput.value) {
            showStatus('복사할 비밀번호가 없습니다.', '#e53e3e');
            return;
        }
        navigator.clipboard.writeText(passwordInput.value)
            .then(() => showStatus('비밀번호가 복사되었습니다.', '#38a169'))
            .catch(() => showStatus('복사에 실패했습니다.', '#e53e3e'));
    }

    function clearFields() {
        document.getElementById('username').value = '';
        document.getElementById('password').value = '';
        document.getElementById('authCode').value = '';
        document.getElementById('codeGroup').classList.add('hidden');
        document.getElementById('verifyBtn').classList.add('hidden');
        document.getElementById('fetchBtn').classList.remove('hidden');
        document.getElementById('statusMsg').innerText = '';
        issuedCode = null;
    }

    function handleFetchCode() {
        const email = document.getElementById('username').value;
        if (!email) {
            showStatus('이메일을 먼저 입력해주세요.', '#e53e3e');
            return;
        }

        if (issuedCode !== null) {
            showStatus('이미 코드가 발급되었습니다. 코드 칸을 확인하세요.', '#d69e2e');
            document.getElementById('authCode').focus();
            return;
        }

        issuedCode = Math.floor(100000 + Math.random() * 900000).toString();
        alert(`발급된 인증 코드: [ ${issuedCode} ]\n\n이 코드는 다시 표시되지 않습니다.`);

        document.getElementById('codeGroup').classList.remove('hidden');
        document.getElementById('verifyBtn').classList.remove('hidden');
        document.getElementById('fetchBtn').classList.add('hidden');
        document.getElementById('authCode').focus();
        showStatus('인증 코드를 입력해주세요.', '#3182ce');
    }

    function verifyAndUnlock() {
        const inputCode = document.getElementById('authCode').value;
        const passwordInput = document.getElementById('password');

        if (!inputCode) {
            showStatus('인증 코드를 입력해주세요.', '#e53e3e');
            return;
        }

        if (inputCode === issuedCode) {
            showStatus('인증 성공! 저장 항목을 클릭하면 자동 복사됩니다.', '#38a169');
            passwordInput.type = 'text';
            passwordInput.focus();
            passwordInput.click();
        } else {
            showStatus('인증 코드가 일치하지 않습니다.', '#e53e3e');
        }
    }

    // 제출 시 팝업 대신 버튼 밑에 성공 문구 표시
    function handleSubmit(e) {
        e.preventDefault();
        showStatus('✅ 비밀번호 저장 요청이 완료되었습니다!', '#38a169');
    }

    // 버튼 밑 텍스트 출력 함수
    function showStatus(msg, color) {
        const statusEl = document.getElementById('statusMsg');
        statusEl.style.color = color;
        statusEl.innerText = msg;
    }
</script>

</body>
</html>
