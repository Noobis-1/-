<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비밀번호 확인기</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f2f5;
            margin: 0;
        }
        .container {
            background: #ffffff;
            padding: 35px 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
            width: 340px;
        }
        h2 {
            margin: 0 0 25px 0;
            text-align: center;
            color: #1a1a1a;
            font-size: 22px;
        }
        .input-group {
            margin-bottom: 18px;
            position: relative;
        }
        label {
            display: block;
            margin-bottom: 6px;
            color: #4a5568;
            font-size: 13px;
            font-weight: 600;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
            outline: none;
        }
        input:focus {
            border-color: #3182ce;
        }
        .btn-stack {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 20px;
        }
        .main-btn {
            width: 100%;
            padding: 12px;
            background-color: #3182ce;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }
        .main-btn:hover {
            background-color: #2b6cb0;
        }
        .sub-btn {
            width: 100%;
            padding: 10px;
            background-color: #e2e8f0;
            color: #4a5568;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }
        .sub-btn:hover {
            background-color: #cbd5e0;
        }
        .status-msg {
            margin-top: 15px;
            font-size: 13px;
            font-weight: 600;
            text-align: center;
            color: #38a169;
            min-height: 18px;
        }

        /* 요소 숨김 기본 클래스 (!important 추가하여 브라우저 강제 숨김) */
        .hidden {
            display: none !important;
        }

        /* 결과 모달 레이어 스타일 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-card {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            width: 320px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            text-align: center;
        }
        .modal-card h3 {
            margin-top: 0;
            color: #2d3748;
        }
        .info-box {
            background: #f7fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 15px;
            margin: 15px 0;
            text-align: left;
            user-select: none;
            -webkit-user-select: none;
        }
        .info-item {
            margin-bottom: 10px;
        }
        .info-item:last-child {
            margin-bottom: 0;
        }
        .info-label {
            font-size: 12px;
            color: #718096;
            font-weight: 600;
        }
        .info-value {
            font-size: 15px;
            color: #1a202c;
            font-weight: 700;
            word-break: break-all;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>비밀번호 저장 / 불러오기</h2>
    <form id="loginForm" onsubmit="handleSubmit(event)">
        
        <div class="input-group">
            <label for="username">이메일 계정</label>
            <input type="email" id="username" name="username" autocomplete="username" placeholder="example@email.com" required>
        </div>

        <div class="input-group">
            <label for="password">비밀번호</label>
            <input type="password" id="password" name="password" autocomplete="current-password" placeholder="비밀번호 입력" required>
        </div>

        <div class="input-group hidden" id="codeGroup">
            <label for="authCode">인증 코드</label>
            <input type="text" id="authCode" placeholder="발급된 인증 코드 입력">
        </div>

        <div class="btn-stack">
            <button type="button" class="sub-btn" id="fetchBtn" onclick="handleFetchCode()">🔑 비번 불러오기 (코드 발급)</button>
            <button type="button" class="sub-btn hidden" id="verifyBtn" onclick="verifyAndShowModal()">✅ 코드 확인 및 결과 보기</button>
            <button type="submit" class="main-btn">비밀번호 저장 제출</button>
            <button type="button" class="sub-btn" onclick="clearFields()">초기화</button>
        </div>

        <div class="status-msg" id="statusMsg"></div>
    </form>
</div>

<!-- inline style로 display:none을 직접 부여하여 초기 실행 시 무조건 숨김 -->
<div class="modal-overlay hidden" id="resultModal" style="display: none;">
    <div class="modal-card">
        <h3>🔑 인증 성공</h3>
        <div class="info-box">
            <div class="info-item">
                <div class="info-label">이메일 계정</div>
                <div class="info-value" id="displayEmail">-</div>
            </div>
            <div class="info-item" style="margin-top: 12px;">
                <div class="info-label">비밀번호</div>
                <div class="info-value" id="displayPassword">******</div>
            </div>
        </div>
        <div class="btn-stack">
            <button type="button" class="main-btn" onclick="copyModalPassword()">📋 비밀번호 복사하기</button>
            <button type="button" class="sub-btn" onclick="closeModal()">닫기</button>
        </div>
    </div>
</div>

<script>
    let issuedCode = null;
    let targetPassword = '';

    function clearFields() {
        document.getElementById('username').value = '';
        document.getElementById('password').value = '';
        document.getElementById('authCode').value = '';
        document.getElementById('codeGroup').classList.add('hidden');
        document.getElementById('verifyBtn').classList.add('hidden');
        document.getElementById('fetchBtn').classList.remove('hidden');
        document.getElementById('statusMsg').innerText = '';
        issuedCode = null;
    }

    function handleFetchCode() {
        const email = document.getElementById('username').value;
        if (!email) {
            showStatus('이메일을 먼저 입력해주세요.', '#e53e3e');
            return;
        }

        if (issuedCode !== null) {
            showStatus('이미 코드가 발급되었습니다. 코드 칸을 확인하세요.', '#d69e2e');
            document.getElementById('authCode').focus();
            return;
        }

        issuedCode = Math.floor(100000 + Math.random() * 900000).toString();
        alert(`발급된 인증 코드: [ ${issuedCode} ]\n\n이 코드는 다시 표시되지 않습니다.`);

        document.getElementById('codeGroup').classList.remove('hidden');
        document.getElementById('verifyBtn').classList.remove('hidden');
        document.getElementById('fetchBtn').classList.add('hidden');
        document.getElementById('authCode').focus();
        showStatus('인증 코드를 입력해주세요.', '#3182ce');
    }

    function verifyAndShowModal() {
        const inputCode = document.getElementById('authCode').value;
        const email = document.getElementById('username').value;
        const password = document.getElementById('password').value;

        if (!inputCode) {
            showStatus('인증 코드를 입력해주세요.', '#e53e3e');
            return;
        }

        if (inputCode === issuedCode) {
            targetPassword = password;
            
            document.getElementById('displayEmail').innerText = email;
            document.getElementById('displayPassword').innerText = password ? password : '(저장된 비밀번호 없음)';
            
            // 모달 열기
            const modal = document.getElementById('resultModal');
            modal.classList.remove('hidden');
            modal.style.display = 'flex';
            showStatus('인증 완료!', '#38a169');
        } else {
            showStatus('인증 코드가 일치하지 않습니다.', '#e53e3e');
        }
    }

    function copyModalPassword() {
        if (!targetPassword) {
            alert('복사할 비밀번호가 없습니다.');
            return;
        }
        navigator.clipboard.writeText(targetPassword)
            .then(() => alert('비밀번호가 클립보드에 복사되었습니다!'))
            .catch(() => alert('복사에 실패했습니다.'));
    }

    function closeModal() {
        const modal = document.getElementById('resultModal');
        modal.classList.add('hidden');
        modal.style.display = 'none';
    }

    function handleSubmit(e) {
        e.preventDefault();
        showStatus('✅ 비밀번호 저장 요청이 완료되었습니다!', '#38a169');
    }

    function showStatus(msg, color) {
        const statusEl = document.getElementById('statusMsg');
        statusEl.style.color = color;
        statusEl.innerText = msg;
    }
</script>

</body>
</html>
