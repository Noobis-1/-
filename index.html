<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비밀번호 확인기</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f2f5;
            margin: 0;
        }
        .container {
            background: #ffffff;
            padding: 35px 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
            width: 340px;
        }
        h2 {
            margin: 0 0 25px 0;
            text-align: center;
            color: #1a1a1a;
            font-size: 22px;
        }
        .input-group {
            margin-bottom: 18px;
            position: relative;
        }
        label {
            display: block;
            margin-bottom: 6px;
            color: #4a5568;
            font-size: 13px;
            font-weight: 600;
        }
        input {
            width: 100%;
            padding: 12px;
            padding-right: 75px;
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus {
            border-color: #3182ce;
        }
        .btn-group-inline {
            position: absolute;
            right: 8px;
            top: 29px;
            display: flex;
            gap: 4px;
        }
        .icon-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 15px;
            padding: 4px 6px;
            border-radius: 4px;
            color: #718096;
        }
        .icon-btn:hover {
            background-color: #edf2f7;
            color: #2d3748;
        }
        .btn-stack {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 25px;
        }
        .main-btn {
            width: 100%;
            padding: 12px;
            background-color: #3182ce;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .main-btn:hover {
            background-color: #2b6cb0;
        }
        .sub-btn {
            width: 100%;
            padding: 10px;
            background-color: #e2e8f0;
            color: #4a5568;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .sub-btn:hover {
            background-color: #cbd5e0;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>비밀번호 확인</h2>
    <form id="loginForm" onsubmit="handleSubmit(event)">
        <div class="input-group">
            <label for="username">아이디 / 이메일</label>
            <input type="text" id="username" name="username" autocomplete="username" placeholder="아이디 입력" required>
        </div>
        
        <div class="input-group">
            <label for="password">비밀번호</label>
            <input type="password" id="password" name="password" autocomplete="current-password" placeholder="비밀번호 입력" required>
            <div class="btn-group-inline">
                <button type="button" class="icon-btn" onclick="togglePassword()" title="비밀번호 보기">👁️</button>
                <button type="button" class="icon-btn" onclick="copyPassword()" title="비밀번호 복사">📋</button>
            </div>
        </div>

        <div class="btn-stack">
            <button type="button" class="sub-btn" onclick="triggerAutofill()">🔑 저장된 비번 불러오기</button>
            <button type="submit" class="main-btn">비밀번호 저장 / 제출</button>
            <button type="button" class="sub-btn" onclick="clearFields()">초기화</button>
        </div>
    </form>
</div>

<script>
    function togglePassword() {
        const passwordInput = document.getElementById('password');
        passwordInput.type = passwordInput.type === 'password' ? 'text' : 'password';
    }

    function copyPassword() {
        const passwordInput = document.getElementById('password');
        if (!passwordInput.value) {
            alert('복사할 비밀번호가 없습니다.');
            return;
        }
        navigator.clipboard.writeText(passwordInput.value)
            .then(() => alert('비밀번호가 클립보드에 복사되었습니다.'))
            .catch(() => alert('복사에 실패했습니다.'));
    }

    function clearFields() {
        document.getElementById('username').value = '';
        document.getElementById('password').value = '';
    }

    // 브라우저의 저장된 계정 목록 창을 강제로 활성화
    function triggerAutofill() {
        const usernameInput = document.getElementById('username');
        usernameInput.focus();
        usernameInput.click();
    }

    function handleSubmit(e) {
        e.preventDefault();
        alert('입력 완료! 브라우저 상단(또는 주소창 우측 열쇠 아이콘)의 비밀번호 저장 팝업을 확인하세요.');
    }
</script>

</body>
</html>
