<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비밀번호 확인기</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f2f5;
            margin: 0;
        }
        .container {
            background: #ffffff;
            padding: 35px 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
            width: 340px;
        }
        h2 {
            margin: 0 0 20px 0;
            text-align: center;
            color: #1a1a1a;
            font-size: 22px;
        }
        .input-group {
            margin-bottom: 15px;
            position: relative;
        }
        label {
            display: block;
            margin-bottom: 6px;
            color: #4a5568;
            font-size: 13px;
            font-weight: 600;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
            outline: none;
        }
        input:focus {
            border-color: #3182ce;
        }
        .btn-stack {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 20px;
        }
        .main-btn {
            width: 100%;
            padding: 12px;
            background-color: #3182ce;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }
        .sub-btn {
            width: 100%;
            padding: 10px;
            background-color: #e2e8f0;
            color: #4a5568;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>비밀번호 저장 / 불러오기</h2>
    <form id="loginForm" onsubmit="handleSubmit(event)">
        
        <div class="input-group">
            <label for="username">이메일 계정</label>
            <input type="email" id="username" name="username" autocomplete="username" placeholder="example@email.com" required>
        </div>

        <div class="input-group">
            <label for="password">비밀번호</label>
            <input type="password" id="password" name="password" autocomplete="current-password" placeholder="비밀번호 입력" required>
        </div>

        <!-- 인증코드 입력란 (초기에는 숨김 처리) -->
        <div class="input-group hidden" id="codeGroup">
            <label for="authCode">발급된 인증 코드</label>
            <input type="text" id="authCode" placeholder="인증 코드 입력">
        </div>

        <div class="btn-stack">
            <button type="button" class="sub-btn" onclick="requestAuth()">🔑 인증 코드 입력 단계로</button>
            <button type="button" class="sub-btn hidden" id="verifyBtn" onclick="verifyAndAutofill()">코드 검증 후 불러오기</button>
            <button type="submit" class="main-btn">비밀번호 저장 / 제출</button>
        </div>
    </form>
</div>

<script>
    // 임시 로컬 저장소에 저장된 코드 (실제 이메일 전송 대신 가상 검증 로직)
    let generatedCode = null;

    function requestAuth() {
        const email = document.getElementById('username').value;
        if (!email) {
            alert('이메일을 먼저 입력해주세요.');
            return;
        }
        
        // 6자리 가상 인증코드 생성 및 알림창 안내
        generatedCode = Math.floor(100000 + Math.random() * 900000).toString();
        alert(`[가증 이메일 발송 완료]\n${email}로 인증 코드가 발송되었습니다.\n\n발급 코드: ${generatedCode}`);

        // 코드 입력창 표시
        document.getElementById('codeGroup').classList.remove('hidden');
        document.getElementById('verifyBtn').classList.remove('hidden');
    }

    function verifyAndAutofill() {
        const inputCode = document.getElementById('authCode').value;

        if (!inputCode) {
            alert('인증 코드를 입력해주세요.');
            return;
        }

        if (inputCode === generatedCode) {
            alert('인증 성공! 저장된 비밀번호 항목을 선택하세요.');
            // 브라우저 포커스를 이동시켜 자동완성 레이어 유도
            const passInput = document.getElementById('password');
            passInput.type = 'text'; // 인증 완료 시 비밀번호를 텍스트로 보이기
            passInput.focus();
        } else {
            alert('인증 코드가 일치하지 않습니다.');
        }
    }

    function handleSubmit(e) {
        e.preventDefault();
        alert('입력 완료! 브라우저의 [비밀번호 저장] 팝업을 확인하세요.');
    }
</script>

</body>
</html>
